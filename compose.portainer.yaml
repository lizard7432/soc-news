# Docker Standalone: build soc-news:local on the target Docker host first.
# Paste this file into Portainer's Stack web editor.
services:
  soc-news:
    image: soc-news:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:7879:8000"
    environment:
      DATA_DIR: /data
      MODEL_CACHE: /models
      SEMANTIC_ENABLED: "true"
      AUTO_MERGE_THRESHOLD: "0.94"
      SHIFT_REPORT_HOURS: "11,19,3"
      SHIFT_NAMES: "日班,小夜班,大夜班"
    volumes:
      - type: bind
        source: /opt/soc-news/app
        target: /app/app
        read_only: true
        bind:
          create_host_path: false
      - soc-data:/data
      - soc-models:/models
    restart: unless-stopped

volumes:
  soc-data:
  soc-models:
